<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Agregar Producto - Cafetería</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Registrar Nuevo Producto</h1>
        <a href="/productos" class="btn-back">← Volver a la Lista</a>
        <br><br>

        <form action="{{ url_for('agregar_producto') }}" method="POST">
            
            <div class="form-group">
                <label for="nombre">Nombre del Producto:</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ej. Café Americano" required>
            </div>

            <div class="form-group">
                <label for="categoria">Categoría:</label>
                <input type="text" id="categoria" name="categoria" placeholder="Ej. Bebidas" required>
            </div>

            <div class="form-group">
                <label for="precio">Precio ($):</label>
                <input type="number" step="0.01" id="precio" name="precio" placeholder="Ej. 35.00" required>
            </div>

            <div class="form-group">
                <label for="stock">Stock / Cantidad:</label>
                <input type="number" id="stock" name="stock" placeholder="Ej. 50" required>
            </div>

            <br>
            <button type="submit" class="btn">Guardar Producto</button>
        </form>
    </div>
</body>
</html>
