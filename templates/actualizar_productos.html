<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Actualizar Producto - Cafetería</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Actualizar Producto #{{ producto.id_producto }}</h1>
        <a href="/producto" class="btn-back">← Volver a la Lista</a>
        <br><br>

        <form action="{{ url_for('actualizar_producto', id=producto.id_producto) }}" method="POST">
            
            <div class="form-group">
                <label for="nombre">Nombre del Producto:</label>
                <input type="text" id="nombre" name="nombre" value="{{ producto.nombre }}" required>
            </div>

            <div class="form-group">
                <label for="precio">Precio ($):</label>
                <input type="number" step="0.01" id="precio" name="precio" value="{{ producto.precio }}" required>
            </div>

            <div class="form-group">
                <label for="stock">Stock / Cantidad:</label>
                <input type="number" id="stock" name="stock" value="{{ producto.stock }}" required>
            </div>

            <br>
            <button type="submit" class="btn">Guardar Cambios</button>
        </form>
    </div>
</body>
</html>
