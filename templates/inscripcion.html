<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Inscripciones</title>
    <script>
        function actualizarDato(event, form, url) {
            event.preventDefault();
            fetch(url, { method: 'POST', body: new FormData(form) })
            .then(res => res.json())
            .then(data => alert(data.message));
        }
    </script>
</head>
<body>
    <a href="/">← Volver al Inicio</a>
    <h2>Inscribir Alumno en Materia</h2>
    <form action="/inscripcion" method="POST">
        <label>Seleccionar Alumno:</label><br>
        <select name="alumno_id" required>
            <option value="">-- Seleccione Alumno --</option>
            {% for a in alumnos %}
                <option value="{{ a.id_Alumnos }}">{{ a.nombre }}</option>
            {% endfor %}
        </select><br><br>

        <label>Seleccionar Materia:</label><br>
        <select name="materia_id" required>
            <option value="">-- Seleccione Materia --</option>
            {% for m in materias %}
                <option value="{{ m.id_materia }}">{{ m.nombre_materia }}</option>
            {% endfor %}
        </select><br><br>

        <button type="submit">Realizar Inscripción</button>
    </form>

    <hr>
    <h2>Lista de Inscripciones</h2>
    <table border="1" cellpadding="5">
        <tr>
            <th>ID Inscripción</th>
            <th>Alumno</th>
            <th>Materia</th>
            <th>Acciones</th>
        </tr>
        {% for ins in inscripciones %}
        <tr>
            <td>{{ ins.id_inscripcion }}</td>
            <form onsubmit="actualizarDato(event, this, '/editar_inscripcion/{{ ins.id_inscripcion }}')">
                <td>
                    <select name="alumno_id" required>
                        {% for a in alumnos %}
                            <option value="{{ a.id_Alumnos }}" {% if a.id_Alumnos == ins.Alumnos_id_Alumnos %}selected{% endif %}>
                                {{ a.nombre }}
                            </option>
                        {% endfor %}
                    </select>
                </td>
                <td>
                    <select name="materia_id" required>
                        {% for m in materias %}
                            <option value="{{ m.id_materia }}" {% if m.id_materia == ins.Materia_id_materia %}selected{% endif %}>
                                {{ m.nombre_materia }}
                            </option>
                        {% endfor %}
                    </select>
                </td>
                <td>
                    <button type="submit">Actualizar Dato</button>
                    <a href="/eliminar_inscripcion/{{ ins.id_inscripcion }}" onclick="return confirm('¿Eliminar registro?')">Eliminar</a>
                </td>
            </form>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
