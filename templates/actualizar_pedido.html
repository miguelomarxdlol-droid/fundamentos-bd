<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Actualizar Pedido - Cafetería</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Actualizar Pedido #{{ pedido.id_pedido }}</h1>
        <a href="/pedidos" class="btn-back">← Volver a la Lista</a>
        <br><br>

        <form action="{{ url_for('actualizar_pedido', id=pedido.id_pedido) }}" method="POST">
            
            <div class="form-group">
                <label for="id_cliente">ID Cliente:</label>
                <input type="number" id="id_cliente" name="id_cliente" value="{{ pedido.id_cliente }}" required>
            </div>

            <div class="form-group">
                <label for="fecha_pedido">Fecha del Pedido:</label>
                <input type="date" id="fecha_pedido" name="fecha_pedido" value="{{ pedido.fecha_pedido }}" required>
            </div>

            <div class="form-group">
                <label for="estado">Estado:</label>
                <select id="estado" name="estado" required>
                    <option value="Pendiente" {% if pedido.estado == 'Pendiente' %}selected{% endif %}>Pendiente</option>
                    <option value="En proceso" {% if pedido.estado == 'En proceso' %}selected{% endif %}>En proceso</option>
                    <option value="Completado" {% if pedido.estado == 'Completado' %}selected{% endif %}>Completado</option>
                    <option value="Cancelado" {% if pedido.estado == 'Cancelado' %}selected{% endif %}>Cancelado</option>
                </select>
            </div>

            <br>
            <button type="submit" class="btn">Guardar Cambios</button>
        </form>
    </div>
</body>
</html>
